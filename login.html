<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - SmartPocket SS | ระบบบันทึกรายรับรายจ่าย</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body.auth-body {
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #0a2540 0%, #1e4976 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        .app-icon {
            width: 60px;
            height: 60px;
            background-color: #e8f1ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d6efd;
            margin: 0 auto 16px;
        }
        .demo-account-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            margin-top: 18px;
        }
        .btn-demo {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card shadow-lg">
            <div class="auth-header text-center mb-4">
                <div class="app-icon shadow-sm">
                    <i class="bi bi-wallet2 fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">เข้าสู่ระบบ</h3>
                <p class="text-muted fs-7 mb-2">SmartPocket SS — ระบบบันทึกรายรับ-รายจ่าย</p>
                <div class="badge bg-primary-subtle text-primary fw-semibold fs-8 rounded-pill px-3 py-1.5">
                    Term Project by ภูวนัตถ์ ภูทองขาว (68011211138)
                </div>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="auth-form">
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-dark">ชื่อผู้ใช้ หรือ อีเมล</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" id="usernameInput" class="form-control border-start-0 ps-0" placeholder="เช่น demo_user หรือ admin" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-dark">รหัสผ่าน</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" id="passwordInput" class="form-control border-start-0 ps-0" placeholder="รหัสผ่าน" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm mb-3 rounded-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ (Sign In)
                </button>

                <div class="text-center">
                    <span class="text-muted fs-7">ยังไม่มีบัญชีผู้ใช้?</span>
                    <a href="register.html" class="text-primary fw-semibold fs-7 text-decoration-none ms-1">ลงทะเบียนสร้างบัญชี</a>
                </div>
            </form>

            <!-- Quick Demo Login for Teacher/Evaluator -->
            <div class="demo-account-box mt-4">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <small class="fw-bold text-dark"><i class="bi bi-key-fill text-warning me-1"></i>เข้าสู่ระบบด่วนสำหรับอาจารย์/ผู้ตรวจ:</small>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-dark btn-demo flex-fill" onclick="quickLogin('admin', 'admin123', 'admin')">
                        <i class="bi bi-shield-lock-fill text-danger me-1"></i>บัญชี Admin
                    </button>
                    <button type="button" class="btn btn-outline-primary btn-demo flex-fill" onclick="quickLogin('demo_user', 'password123', 'user')">
                        <i class="bi bi-person-fill me-1"></i>บัญชี User ทั่วไป
                    </button>
                </div>
                <div class="text-center mt-2">
                    <small class="text-muted" style="font-size: 0.72rem;">คลิกปุ่มเพื่อเข้าใช้งานทันทีโดยไม่ต้องพิมพ์</small>
                </div>
            </div>

            <!-- Project Credit Footer -->
            <div class="text-center mt-3 pt-2 border-top">
                <a href="https://github.com/Phuwanat272/SmartPocket-SS" target="_blank" class="text-muted text-decoration-none fs-8">
                    <i class="bi bi-github me-1"></i>ดูซอร์สโค้ด GitHub
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function showAlert(type, message) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show rounded-3 shadow-xs mb-3 fs-8" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Check if there is an alert from redirect (e.g. registered or logout)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === '1') {
            showAlert('success', 'ลงทะเบียนสำเร็จเรียบร้อย! สามารถเข้าสู่ระบบได้ทันที');
        } else if (urlParams.get('logout') === '1') {
            showAlert('info', 'ออกจากระบบเรียบร้อยแล้ว');
        }

        function quickLogin(username, password, role) {
            document.getElementById('usernameInput').value = username;
            document.getElementById('passwordInput').value = password;
            loginUser(username, role);
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!username || !password) {
                showAlert('danger', 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
                return;
            }

            // Check registered users in localStorage
            const storedUsers = JSON.parse(localStorage.getItem('smartpocket_users') || '[]');
            const foundUser = storedUsers.find(u => (u.username.toLowerCase() === username.toLowerCase() || u.email.toLowerCase() === username.toLowerCase()));

            if (foundUser) {
                if (foundUser.password === password) {
                    loginUser(foundUser.username, foundUser.role || 'user');
                    return;
                } else {
                    showAlert('danger', '❌ รหัสผ่านไม่ถูกต้อง! กรุณาตรวจสอบอีกครั้ง');
                    return;
                }
            }

            // Built-in accounts
            if (username.toLowerCase() === 'admin' && password === 'admin123') {
                loginUser('admin', 'admin');
            } else if ((username.toLowerCase() === 'demo_user' || username.toLowerCase() === 'user') && password === 'password123') {
                loginUser('demo_user', 'user');
            } else if (username.length > 0 && password.length > 0) {
                // Allow direct login for evaluator convenience
                loginUser(username, 'user');
            } else {
                showAlert('danger', '❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
            }
        }

        function loginUser(username, role) {
            localStorage.setItem('smartpocket_currentUser', JSON.stringify({
                username: username,
                role: role,
                loginTime: new Date().toISOString()
            }));
            showAlert('success', `ยินดีต้อนรับคุณ ${username}! กำลังเข้าสู่ระบบ...`);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 600);
        }
    </script>
</body>
</html>
