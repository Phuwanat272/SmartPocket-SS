<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - SmartPocket SS | ระบบบันทึกรายรับรายจ่าย</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        // ถ้าล็อกอินอยู่แล้วให้ redirect ไป index.html
        if (localStorage.getItem('smartpocket_currentUser')) {
            window.location.replace('index.html');
        }
    </script>
    <style>
        body.auth-body {
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #0a2540 0%, #1e4976 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        .app-icon {
            width: 60px;
            height: 60px;
            background-color: #e8f1ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d6efd;
            margin: 0 auto 16px;
        }
        .demo-account-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            margin-top: 18px;
        }
        .btn-demo {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
        }
        .captcha-box {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            letter-spacing: 6px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 800;
            color: #1e293b;
            text-decoration: line-through;
            transform: skewX(-6deg);
            border: 2px dashed #94a3b8 !important;
            user-select: none;
            display: inline-block;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card shadow-lg">
            <div class="auth-header text-center mb-4">
                <div class="app-icon shadow-sm">
                    <i class="bi bi-wallet2 fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">เข้าสู่ระบบ</h3>
                <p class="text-muted fs-7 mb-2">SmartPocket SS — ระบบบันทึกรายรับ-รายจ่าย</p>
                <div class="badge bg-primary-subtle text-primary fw-semibold fs-8 rounded-pill px-3 py-1.5">
                    Term Project by ภูวนัตถ์ ภูทองขาว (68011211138)
                </div>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="auth-form">
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-dark">ชื่อผู้ใช้ หรือ อีเมล</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" id="usernameInput" class="form-control border-start-0 ps-0" placeholder="เช่น demo_user หรือ Admin ICE" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-dark">รหัสผ่าน</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" id="passwordInput" class="form-control border-start-0 ps-0" placeholder="รหัสผ่าน" required>
                    </div>
                </div>

                <!-- Captcha Protection (Slide 21 & 25: ป้องกัน SPAM และ Bot ด้วย Captcha) -->
                <div class="mb-3 p-2.5 rounded-3 bg-light border">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold fs-8 text-dark m-0">
                            <i class="bi bi-robot text-primary me-1"></i>รหัสยืนยันความปลอดภัย (Captcha)
                        </label>
                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none fs-8 text-primary" onclick="generateCaptcha()" title="เปลี่ยนรหัสใหม่">
                            <i class="bi bi-arrow-clockwise me-1"></i>เปลี่ยนรหัส
                        </button>
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <div id="captchaDisplay" class="captcha-box px-3 py-1 rounded-2 shadow-xs">
                            <!-- Rendered by JS -->
                        </div>
                        <span class="text-muted fs-8"><i class="bi bi-shield-check text-success me-1"></i>ป้องกัน SPAM & Bot (Slide 25)</span>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0 fs-8"><i class="bi bi-key"></i></span>
                        <input type="text" id="captchaInput" class="form-control bg-white border-start-0 ps-0 fs-8 text-uppercase" placeholder="กรอกตัวอักษร 4 หลักตามภาพ" required autocomplete="off" maxlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm mb-3 rounded-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ (Sign In)
                </button>

                <div class="text-center">
                    <span class="text-muted fs-7">ยังไม่มีบัญชีผู้ใช้?</span>
                    <a href="register.html" class="text-primary fw-semibold fs-7 text-decoration-none ms-1">ลงทะเบียนสร้างบัญชี</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentCaptcha = '';

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = code;
            const display = document.getElementById('captchaDisplay');
            if (display) {
                display.textContent = code;
            }
        }

        function showAlert(type, message) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show rounded-3 shadow-xs mb-3 fs-8" role="alert">
                    <i class="bi bi-shield-exclamation me-2"></i>${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Check if there is an alert from redirect (e.g. registered or logout)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === '1') {
            showAlert('success', 'ลงทะเบียนสำเร็จเรียบร้อย! สามารถเข้าสู่ระบบได้ทันที');
        } else if (urlParams.get('logout') === '1') {
            showAlert('info', 'ออกจากระบบเรียบร้อยแล้ว');
        }

        function handleLogin(e) {
            e.preventDefault();
            const rawUsername = document.getElementById('usernameInput').value.trim();
            const rawPassword = document.getElementById('passwordInput').value;
            const inputCaptcha = (document.getElementById('captchaInput').value || '').trim().toUpperCase();

            // 1. ตรวจสอบ Captcha ป้องกัน SPAM / Bot โจมตีแบบ Brute-force (Slide 21 & 25)
            if (inputCaptcha !== currentCaptcha) {
                showAlert('danger', '❌ รหัส Captcha ไม่ถูกต้อง! กรุณากรอกรหัสตามภาพ (ระบบป้องกัน SPAM & Bot โจมตีตามสไลด์ที่ 25)');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            // 2. ตรวจจับและป้องกัน SQL Injection (Slide 14-16)
            // ตัวอย่าง: ' OR '1'='1 หรือ ' OR 'x'='x หรือ admin' or ''='' ; #
            const sqliPattern = /('|--|#|\/\*|\b(OR|AND)\b\s+['\w]+\s*=\s*['\w]+)/i;
            if (sqliPattern.test(rawUsername) || sqliPattern.test(rawPassword)) {
                showAlert('danger', '🛡️ ตรวจพบคำสั่งไม่ปลอดภัย! ระบบป้องกันการโจมตี SQL Injection (CWE-89 ตามสไลด์หน้า 14-16) ได้ระงับคำขอไว้เรียบร้อยแล้ว');
                generateCaptcha();
                return;
            }

            const username = rawUsername;
            const password = rawPassword;

            if (!username || !password) {
                showAlert('danger', 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
                return;
            }

            // Built-in system accounts (ตรงกับเอกสารโครงการ)
            const BUILTIN_ACCOUNTS = [
                { username: 'Admin ICE', email: 'ice@admin.local',      password: 'admin123',  role: 'admin' },
                { username: 'demo_user', email: 'demo@system.local',    password: 'user123',   role: 'user'  },
                { username: 'icesyy',    email: 'ice12345@gmail.com',   password: 'user123',   role: 'user'  },
            ];

            // Check built-in accounts first
            const builtIn = BUILTIN_ACCOUNTS.find(a =>
                a.username.toLowerCase() === username.toLowerCase() ||
                a.email.toLowerCase() === username.toLowerCase()
            );

            if (builtIn) {
                if (builtIn.password === password) {
                    loginUser(builtIn.username, builtIn.role);
                    return;
                } else {
                    showAlert('danger', '❌ รหัสผ่านไม่ถูกต้อง! กรุณาตรวจสอบอีกครั้ง');
                    generateCaptcha();
                    return;
                }
            }

            // Check registered users in localStorage (สมาชิกที่ลงทะเบียนเพิ่มเอง)
            const storedUsers = JSON.parse(localStorage.getItem('smartpocket_users') || '[]');
            const foundUser = storedUsers.find(u =>
                u.username.toLowerCase() === username.toLowerCase() ||
                u.email.toLowerCase() === username.toLowerCase()
            );

            if (foundUser) {
                if (foundUser.password === password) {
                    loginUser(foundUser.username, foundUser.role || 'user');
                } else {
                    showAlert('danger', '❌ รหัสผ่านไม่ถูกต้อง! กรุณาตรวจสอบอีกครั้ง');
                    generateCaptcha();
                }
            } else {
                showAlert('danger', '❌ ไม่พบชื่อผู้ใช้หรืออีเมลนี้ในระบบ กรุณาตรวจสอบอีกครั้ง');
                generateCaptcha();
            }
        }

        function loginUser(username, role) {
            localStorage.setItem('smartpocket_currentUser', JSON.stringify({
                username: username,
                role: role,
                loginTime: new Date().toISOString()
            }));
            showAlert('success', `ยินดีต้อนรับคุณ ${username}! กำลังเข้าสู่ระบบ...`);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 600);
        }

        // Initialize captcha on page load
        document.addEventListener('DOMContentLoaded', generateCaptcha);
    </script>
</body>
</html>
