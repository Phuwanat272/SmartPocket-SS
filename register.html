<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน - SmartPocket SS | บันทึกรายรับรายจ่าย</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body.auth-body {
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #0a2540 0%, #1e4976 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        .app-icon {
            width: 60px;
            height: 60px;
            background-color: #e8f1ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d6efd;
            margin: 0 auto 16px;
        .captcha-box {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            letter-spacing: 6px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 800;
            color: #1e293b;
            text-decoration: line-through;
            transform: skewX(-6deg);
            border: 2px dashed #94a3b8 !important;
            user-select: none;
            display: inline-block;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card shadow-lg">
            <div class="auth-header text-center mb-4">
                <div class="app-icon shadow-sm">
                    <i class="bi bi-person-plus-fill fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">สร้างบัญชีผู้ใช้ใหม่</h3>
                <p class="text-muted fs-7 mb-2">SmartPocket SS — ระบบบันทึกรายรับ-รายจ่าย</p>
                <div class="badge bg-primary-subtle text-primary fw-semibold fs-8 rounded-pill px-3 py-1.5">
                    Term Project by ภูวนัตถ์ ภูทองขาว (68011211138)
                </div>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <form id="registerForm" onsubmit="handleRegister(event)" class="auth-form">
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-dark">ชื่อผู้ใช้ (Username) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" id="regUsername" class="form-control border-start-0 ps-0" placeholder="เช่น somchai_k" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-dark">อีเมล (Email) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="regEmail" class="form-control border-start-0 ps-0" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-dark">รหัสผ่าน <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" id="regPassword" class="form-control border-start-0 ps-0" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-dark">ยืนยันรหัสผ่าน <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-check"></i></span>
                        <input type="password" id="regConfirmPassword" class="form-control border-start-0 ps-0" placeholder="ยืนยันรหัสผ่านอีกครั้ง" required minlength="6">
                    </div>
                </div>

                <!-- Captcha Protection (Slide 21 & 25: ป้องกัน SPAM และ Bot ในการสมัครสมาชิก) -->
                <div class="mb-3 p-2.5 rounded-3 bg-light border">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold fs-8 text-dark m-0">
                            <i class="bi bi-robot text-primary me-1"></i>รหัสยืนยันความปลอดภัย (Captcha)
                        </label>
                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none fs-8 text-primary" onclick="generateCaptcha()" title="เปลี่ยนรหัสใหม่">
                            <i class="bi bi-arrow-clockwise me-1"></i>เปลี่ยนรหัส
                        </button>
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <div id="captchaDisplay" class="captcha-box px-3 py-1 rounded-2 shadow-xs">
                            <!-- Rendered by JS -->
                        </div>
                        <span class="text-muted fs-8"><i class="bi bi-shield-check text-success me-1"></i>ป้องกัน SPAM & Bot (Slide 25)</span>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0 fs-8"><i class="bi bi-key"></i></span>
                        <input type="text" id="captchaInput" class="form-control bg-white border-start-0 ps-0 fs-8 text-uppercase" placeholder="กรอกตัวอักษร 4 หลักตามภาพ" required autocomplete="off" maxlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm mb-3 rounded-3">
                    <i class="bi bi-check-circle me-2"></i>ยืนยันการลงทะเบียน (Sign Up)
                </button>

                <div class="text-center">
                    <span class="text-muted fs-7">มีบัญชีผู้ใช้แล้ว?</span>
                    <a href="login.html" class="text-primary fw-semibold fs-7 text-decoration-none ms-1">เข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentCaptcha = '';

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = code;
            const display = document.getElementById('captchaDisplay');
            if (display) {
                display.textContent = code;
            }
        }

        function showAlert(type, message) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show rounded-3 shadow-xs mb-3 fs-8" role="alert">
                    <i class="bi bi-shield-exclamation me-2"></i>${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function handleRegister(e) {
            e.preventDefault();
            const rawUsername = document.getElementById('regUsername').value.trim();
            const rawEmail = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const inputCaptcha = (document.getElementById('captchaInput').value || '').trim().toUpperCase();

            // 1. ตรวจสอบ Captcha ป้องกัน SPAM / Bot Auto-Register (Slide 21 & 25)
            if (inputCaptcha !== currentCaptcha) {
                showAlert('danger', '❌ รหัส Captcha ไม่ถูกต้อง! กรุณากรอกรหัสตามภาพ (ระบบป้องกัน SPAM & Bot ตามสไลด์ที่ 25)');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            // 2. ตรวจจับและป้องกัน SQL Injection & XSS (Slide 10-16)
            const dangerousPattern = /('|--|#|\/\*|<|>|javascript:|\b(OR|AND)\b\s+['\w]+\s*=\s*['\w]+)/i;
            if (dangerousPattern.test(rawUsername) || dangerousPattern.test(rawEmail)) {
                showAlert('danger', '🛡️ ตรวจพบอักขระหรือคำสั่งที่ไม่ปลอดภัย! ระบบได้ป้องกันการโจมตี SQL Injection และ XSS ตามข้อกำหนดเรียบร้อยแล้ว');
                generateCaptcha();
                return;
            }

            const username = rawUsername;
            const email = rawEmail;

            if (!username || !email || !password || !confirmPassword) {
                showAlert('danger', 'กรุณากรอกข้อมูลให้ครบทุกช่อง');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('danger', 'รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน');
                return;
            }

            if (password.length < 6) {
                showAlert('danger', 'รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร');
                return;
            }

            const storedUsers = JSON.parse(localStorage.getItem('smartpocket_users') || '[]');
            const exists = storedUsers.some(u => u.username.toLowerCase() === username.toLowerCase() || u.email.toLowerCase() === email.toLowerCase());

            if (exists) {
                showAlert('danger', 'ชื่อผู้ใช้หรืออีเมลนี้มีอยู่ในระบบแล้ว');
                generateCaptcha();
                return;
            }

            storedUsers.push({
                username: username,
                email: email,
                password: password,
                role: 'user',
                createdAt: new Date().toISOString()
            });

            localStorage.setItem('smartpocket_users', JSON.stringify(storedUsers));
            window.location.href = 'login.html?registered=1';
        }

        // Initialize captcha on load
        document.addEventListener('DOMContentLoaded', generateCaptcha);
    </script>
</body>
</html>
